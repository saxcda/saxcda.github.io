<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1020"><title>GRE 1500 記憶測驗</title><style>:root{--bg:#0b1020;--p:#131b30;--p2:#1a2540;--t:#f6f8fc;--m:#9da9c0;--a:#7c9cff;--g:#5fda9a;--r:#ff7f8d;--l:#2a3655}*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang TC",Arial,sans-serif}.app{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(95px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{font-size:12px;color:var(--m);background:var(--p);border:1px solid var(--l);border-radius:999px;padding:7px 10px}.card{background:var(--p);border:1px solid var(--l);border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 14px 40px rgba(0,0,0,.2)}h1{font-size:25px;margin:0 0 5px}.sub{color:var(--m);font-size:14px;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat{background:var(--p2);padding:10px;border-radius:13px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--m)}button,select{font:inherit}button{border:0;border-radius:13px;padding:12px 14px;font-weight:700;background:var(--a);color:#fff}.ghost{background:var(--p2);border:1px solid var(--l);color:var(--t)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}select{background:var(--p2);color:var(--t);border:1px solid var(--l);padding:11px 12px;border-radius:13px;min-width:120px}.qmeta{display:flex;justify-content:space-between;color:var(--m);font-size:12px}.word{font-size:40px;font-weight:800;letter-spacing:-1px;margin:22px 0 18px;word-break:break-word}.opts{display:grid;gap:10px}.opt{width:100%;text-align:left;background:var(--p2);border:1px solid var(--l);padding:14px 15px;border-radius:14px;color:var(--t);font-weight:650}.opt.correct{border-color:var(--g);background:rgba(95,218,154,.12)}.opt.wrong{border-color:var(--r);background:rgba(255,127,141,.10)}.feedback{min-height:25px;margin-top:12px;font-size:14px}.good{color:var(--g)}.bad{color:var(--r)}.memory{margin-top:12px;padding-top:12px;border-top:1px solid var(--l);color:var(--m);font-size:12px;line-height:1.6}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.review-item{padding:12px 0;border-bottom:1px solid var(--l)}.review-item b{font-size:16px}.review-item small{display:block;color:var(--m);margin-top:4px}.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(11,16,32,.94);backdrop-filter:blur(16px);border-top:1px solid var(--l);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}.tabs button{background:transparent;color:var(--m);padding:10px 18px}.tabs button.active{background:var(--p2);color:var(--t)}.hidden{display:none!important}.notice{font-size:12px;color:var(--m);margin-top:10px}.due{color:#ffd166}@media(max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}.word{font-size:36px}.card{padding:15px}}</style></head><body><div class="app"><div class="top"><div><h1>GRE 1500</h1><div class="sub">30 Lists · 中文四選一 · 記憶複習</div></div><div class="pill" id="saveStatus">本機記憶</div></div><section id="home"><div class="card"><b>學習進度</b><div class="stats"><div class="stat"><b id="sDone">0</b><span>已學</span></div><div class="stat"><b id="sAcc">—</b><span>正確率</span></div><div class="stat"><b id="sDue">0</b><span>待複習</span></div><div class="stat"><b id="sPos">1</b><span>目前題號</span></div></div><div class="controls"><button onclick="resume()">繼續學習</button><button class="ghost" onclick="startDue()">開始到期複習</button><select id="listSel" onchange="jumpList()"><option value="0">全部 Lists</option></select></div><div class="notice">答對間隔：10 分鐘 → 1 天 → 3 天 → 7 天 → 14 天 → 30 天 → 60 天；答錯 5 分鐘後再複習。</div></div></section><section id="quiz" class="hidden"><div class="card"><div class="qmeta"><span id="qCount"></span><span id="qList"></span></div><div class="word" id="word"></div><div class="opts" id="opts"></div><div class="feedback" id="feedback"></div><div class="memory" id="memory"></div><div class="nav"><button class="ghost" onclick="prevQ()">← 上一題</button><button onclick="nextQ()">下一題 →</button></div></div></section><section id="review" class="hidden"><div class="card"><div class="top"><b>複習中心</b><button class="ghost" onclick="startDue()">開始到期複習</button></div><div id="reviewList"></div></div></section></div><div class="tabs"><button id="tabHome" class="active" onclick="show('home')">首頁</button><button id="tabQuiz" onclick="show('quiz');renderQ()">Quiz</button><button id="tabReview" onclick="show('review');renderReview()">Review</button></div><script src="data1.js"></script><script src="data2.js"></script><script src="data3.js"></script><script src="data4.js"></script><script src="data5.js"></script><script>(()=>{'use strict';const D=window.GRE_DATA||[],K='gre1500_web_v1',INT=[6e5,864e5,2592e5,6048e5,12096e5,2592e6,5184e6],LAB=['10 分鐘','1 天','3 天','7 天','14 天','30 天','60 天'];let S={last:0,cards:{},answers:0,correct:0},idx=0,mode='normal',queue=[],qi=0,canStore=true;try{const x=JSON.parse(localStorage.getItem(K)||'null');if(x)S=Object.assign(S,x)}catch(e){canStore=false}for(let i=1;i<=30;i++){let o=document.createElement('option');o.value=i;o.textContent='List '+i;listSel.appendChild(o)}function save(){if(!canStore)return;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){canStore=false;saveStatus.textContent='暫時記憶'}}function card(i){return S.cards[i]||(S.cards[i]={stage:-1,next:0,seen:0,c:0,w:0,last:null})}function fmt(ts){if(!ts)return'尚未排程';let d=ts-Date.now();if(d<=0)return'現在到期';if(d<36e5)return Math.ceil(d/6e4)+' 分鐘後';if(d<864e5)return Math.ceil(d/36e5)+' 小時後';return new Date(ts).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function optionsFor(i){let [w,m,l]=D[i],pool=D.filter((x,j)=>j!==i&&x[2]===l&&x[1]!==m).map(x=>x[1]);for(let a=pool.length-1;a>0;a--){let b=Math.floor(Math.random()*(a+1));[pool[a],pool[b]]=[pool[b],pool[a]]}let arr=[m,...pool.slice(0,3)];for(let a=arr.length-1;a>0;a--){let b=Math.floor(Math.random()*(a+1));[arr[a],arr[b]]=[arr[b],arr[a]]}return arr}window.show=function(id){['home','quiz','review'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['Home','Quiz','Review'].forEach(x=>document.getElementById('tab'+x).classList.toggle('active',x.toLowerCase()===id));if(id==='home')stats();if(id==='review')renderReview()};window.renderQ=function(){if(mode==='review'&&queue.length)idx=queue[qi]??idx;let [w,m,l]=D[idx]||D[0];qCount.textContent='題目 '+(idx+1)+' / 1500';qList.textContent='List '+l+' · #'+((idx%50)+1);word.textContent=w;feedback.textContent='';feedback.className='feedback';opts.innerHTML='';optionsFor(idx).forEach(v=>{let b=document.createElement('button');b.className='opt';b.textContent=v;b.onclick=()=>answer(v===m,b,m);opts.appendChild(b)});let c=card(idx);memory.innerHTML='記憶階段：'+(c.stage<0?'新字／重學':LAB[c.stage])+'<br>下一次複習：'+fmt(c.next)+' · 答對 '+c.c+' / 答錯 '+c.w;S.last=idx;save();stats()};function answer(ok,b,m){[...opts.children].forEach(x=>x.disabled=true);S.answers++;let c=card(idx);c.seen++;c.last=ok?'c':'w';if(ok){S.correct++;c.c++;c.stage=Math.min(c.stage+1,INT.length-1);c.next=Date.now()+INT[Math.max(0,c.stage)];b.classList.add('correct');feedback.textContent='答對 ✓';feedback.className='feedback good'}else{c.w++;c.stage=-1;c.next=Date.now()+3e5;b.classList.add('wrong');[...opts.children].find(x=>x.textContent===m)?.classList.add('correct');feedback.textContent='答錯。正確答案：'+m;feedback.className='feedback bad'}save();stats();memory.innerHTML='下一次複習：'+fmt(c.next)+' · 答對 '+c.c+' / 答錯 '+c.w}window.nextQ=function(){if(mode==='review'&&queue.length){qi++;if(qi>=queue.length){mode='normal';show('review');return}idx=queue[qi]}else idx=Math.min(1499,idx+1);renderQ()};window.prevQ=function(){if(mode==='review'&&queue.length){qi=Math.max(0,qi-1);idx=queue[qi]}else idx=Math.max(0,idx-1);renderQ()};window.resume=function(){mode='normal';idx=Math.min(1499,Math.max(0,S.last||0));show('quiz');renderQ()};window.startDue=function(){queue=D.map((_,i)=>i).filter(i=>{let c=S.cards[i];return c&&c.next&&c.next<=Date.now()});if(!queue.length){alert('目前沒有到期單字');return}mode='review';qi=0;idx=queue[0];show('quiz');renderQ()};window.jumpList=function(){let n=+listSel.value;if(!n)return;mode='normal';idx=(n-1)*50;show('quiz');renderQ()};window.renderReview=function(){let now=Date.now(),rows=D.map((x,i)=>({i,x,c:S.cards[i]})).filter(o=>o.c&&o.c.seen).sort((a,b)=>(a.c.next||9e15)-(b.c.next||9e15));reviewList.innerHTML=rows.length?rows.slice(0,200).map(o=>'<div class="review-item"><b>'+esc(o.x[0])+'</b> · '+esc(o.x[1])+'<small>List '+o.x[2]+' · '+(o.c.next<=now?'<span class="due">現在到期</span>':fmt(o.c.next))+' · ✓ '+o.c.c+' / ✕ '+o.c.w+'</small></div>').join(''):'<div class="sub" style="margin-top:14px">尚無學習紀錄。</div>'}function stats(){let cs=Object.values(S.cards),done=cs.filter(c=>c.seen).length,due=cs.filter(c=>c.next&&c.next<=Date.now()).length;sDone.textContent=done;sAcc.textContent=S.answers?Math.round(S.correct/S.answers*100)+'%':'—';sDue.textContent=due;sPos.textContent=(S.last||0)+1;saveStatus.textContent=canStore?'✓ 已記憶':'暫時記憶'}window.stats=stats;stats();})();</script></body></html>
